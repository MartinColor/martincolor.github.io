# Recordatorios de Matías por Telegram.
# Las horas están en UTC (Uruguay = UTC-3): "10 14 * * 1-5" = 11:10 de lunes a viernes.
# Cada cron debe coincidir con una "hora" de matias/datos.json (en hora de Uruguay).
# Si se agrega o cambia una hora en datos.json, agregar/cambiar también su línea acá.
# Necesita los secrets TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID (sin ellos no manda nada).
name: Recordatorios de Matías

on:
  schedule:
    - cron: "20 11 * * 1-5"   # 08:20 L-V  apertura
    - cron: "35 11 * * 6"     # 08:35 Sáb  apertura
    - cron: "40 11 * * 1,3,5" # 08:40 L-M-V laboratorio
    - cron: "10 14 * * 1-5"   # 11:10 L-V  reparto
    - cron: "50 14 * * 6"     # 11:50 Sáb  limpieza
    - cron: "10 15 * * 6"     # 12:10 Sáb  entrar mercadería
    - cron: "5 17 * * 1-5"    # 14:05 L-V  vuelta de tarde
    - cron: "30 17 * * 2,4"   # 14:30 Ma-J básicos automotriz
    - cron: "5 18 * * 5"      # 15:05 Vie  compras del local
    - cron: "20 20 * * 1-5"   # 17:20 L-V  limpieza
    - cron: "45 20 * * 1-5"   # 17:45 L-V  entrar mercadería
  workflow_dispatch:
    inputs:
      hora:
        description: "Hora de Uruguay a simular (HH:MM). Vacío = mensaje de prueba."
        required: false

permissions:
  contents: read

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Mandar recordatorio
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRON: ${{ github.event.schedule }}
          HORA: ${{ github.event.inputs.hora }}
          PRUEBA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.hora == '' && '1' || '' }}
        run: python3 matias/herramientas/telegram_recordatorio.py
